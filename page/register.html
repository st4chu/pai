<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="secondary.css">
    <title>E-Kalenarz</title>
</head>
<body>
    <header id="header">
            <h1>E-Kalendarz</h1>
    </header>
    <nav id="nav">
        <ul class="links">
            <li>
                <a href="login.php">Login</a>
            </li>
            <li>
                <a href="index.html">Powrót</a>
            </li>
        </ul>
    </nav>

    <div id="main">
        <div id="post">
            <h2>Zarejestruj się</h2>
            <form id="form">
                <div class="row">
                    <input type="text" id="login" placeholder="Nazwa użytkownika" class="col-6">
                    <div class="col-6"></div>
                    <input type="password" id="pass1" placeholder="Hasło" class="col-6">
                    <div class="col-6"></div>
                    <input type="password" id="pass2" placeholder="Hasło" class="col-6">
                    <div class="col-6"></div>
                    <button id="send" class="primary col-2">Dodaj</button>
                    <div class="col-12"></div>    
                    <button id="reset" class="col-2">Wczyść</button>
                </div>
            </form>
            <div>
                <span id="alert"></span>  
                <span id="message"></span>
                <hr>
            </div>
        </div>
    </div>
    <script>
        const API_USR = document.location.origin+"/rest2zip/api/users/index.php";
        const aalert = document.getElementById("alert");
        const message = document.getElementById("message");
        const sender = document.getElementById("send");
        sender.addEventListener('click', (e) =>{
            e.preventDefault();
            console.log("rejestracja");
            let login = document.getElementById("login").value;
            let pass1 = document.getElementById("pass1").value;
            let pass2 = document.getElementById("pass2").value;
            // niekompletne dane
            if(!login || !pass1 || !pass2){
                aalert.innerHTML = "Niekompletne dane";
                message.innerHTML = "";
            }
            // ok
            else{
                if(pass1 === pass2){
                    message.innerHTML = "OK";
                    aalert.innerHTML = "";
                    const data = {
                        login : login,
                        password : pass1
                    }
                    addUser(data);
                }
                else{
                    message.innerHTML = "";
                    aalert.innerHTML = "Hasła nie są takie same";
                }
                
            }

        })
        async function addUser(data){
            console.log("IN addUser()");
            const found = await findUser(data.login);
            alert(found);
            if(!found){
                console.log("Dodawanie");
                try{
                    const response = await fetch(API_USR, {
                        method : 'POST',
                        headers:{
                            'Content-Type' : 'application/json',
                        },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    if(result) alert("Dodano użytkownika :)");
                    document.cookie = "logged=true";
                    document.cookie = `login=${data.login}`;
                }
                catch(e){
                    console.log("Błąd :( ",e);
                }
            }
            else{
                aalert.innerHTML = "Użytkownik już istnieje";
                message.innerHTML = "";
            }

        }

        // szuka czy uzytkownik nie istnieje
        // jesli tak to zwraca true
        // inaczej false
        async function findUser(login){
            console.log("IN findUser()");
            console.log(login);
            let found = false;
            try{
                const response = await fetch(`${API_USR}?login=${login}`,{
                    method : 'GET'
                });
                const result = await response.json();
                if(await result.length > 0){
                    found = true;
                }
                else{
                    found = false;
                }
                console.log("ODP: ",found);
                return found;
            }
            catch(e){
                console.log("błąd przy sprawdzaniu bd", e);
            }
        }
    </script>
</body>
</html>
